plugins { id 'com.android.application' }

def webSrc = file("${rootDir}/../app")
def webOut = layout.buildDirectory.dir("generated/web").get().asFile

tasks.register("copyWebAssets", Copy) {
  from(webSrc)
  into(new File(webOut, "www"))
}

android {
  namespace 'cn.siqyin.hanfr'
  compileSdk 34

  defaultConfig {
    applicationId "cn.siqyin.hanfr"
    minSdk 23
    targetSdk 34
    versionCode 10003
    versionName "1.0.3"
  }

  sourceSets {
    main {
      assets.srcDirs += [webOut]
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix ""
    }
    release {
      // 正式簽名：密鑰不入庫，從環境變量或 keystore 目錄讀取。
      // 漢維辭典的教訓：用 debug 簽名發出去的包無法覆蓋升級，
      // 所以這裡從第一版就用正式簽名；缺少密鑰時退回 debug 並在 CI 報錯。
      def ksPath = rootProject.file("keystore/hanfr-release.jks")
      if (ksPath.exists() && System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
        signingConfig signingConfigs.create("release") {
          storeFile ksPath
          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
          keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "hanfr"
          keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
        }
      } else {
        signingConfig signingConfigs.debug
      }
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  packaging {
    resources.excludes += ['META-INF/*']
  }
}

tasks.named("preBuild") { dependsOn("copyWebAssets") }